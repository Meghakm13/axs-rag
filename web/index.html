<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AXS NL → SQL Multi-Agent System</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px;
      background: #0f172a;
      color: #e5e7eb;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 24px;
    }
    label {
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
    }
    textarea {
      width: 100%;
      min-height: 70px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      padding: 8px;
      background: #020617;
      color: #e5e7eb;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #022c22;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .section {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #020617;
      border: 1px solid #1f2937;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .section h2 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: #bfdbfe;
    }
    .error {
      color: #fecaca;
    }
    code {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>AXS NL → SQL Multi-Agent System</h1>
  <div class="subtitle">
    Ask questions about orders, customers, revenue etc.
  </div>

  <div>
    <label for="question">Your question:</label>
    <textarea id="question" placeholder="e.g. How many orders did we get from Mumbai last year?"></textarea>
    <button id="askBtn">Ask</button>
    <span id="status" style="margin-left:8px;font-size:0.85rem;color:#9ca3af;"></span>
  </div>

  <div class="section">
    <h2>Answer</h2>
    <div id="answer">—</div>
  </div>

  <div class="section">
    <h2>Generated SQL</h2>
    <code id="sqlQuery">—</code>
  </div>

  <div class="section">
    <h2>Result Rows (raw)</h2>
    <pre id="rows">—</pre>
  </div>

  <div class="section">
    <h2>Error (if any)</h2>
    <div id="error" class="error">—</div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/ask";

    const questionInput = document.getElementById("question");
    const askBtn = document.getElementById("askBtn");
    const statusEl = document.getElementById("status");
    const answerEl = document.getElementById("answer");
    const sqlEl = document.getElementById("sqlQuery");
    const rowsEl = document.getElementById("rows");
    const errorEl = document.getElementById("error");

    async function askQuestion() {
      const question = questionInput.value.trim();
      if (!question) {
        alert("Please type a question first.");
        return;
      }

      askBtn.disabled = true;
      statusEl.textContent = "Thinking...";
      answerEl.textContent = "—";
      sqlEl.textContent = "—";
      rowsEl.textContent = "—";
      errorEl.textContent = "—";

      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ question }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          errorEl.textContent = data.detail || "Something went wrong.";
          statusEl.textContent = "Error";
          return;
        }

        answerEl.textContent = data.answer || "No answer generated.";
        sqlEl.textContent = data.intermediate?.sql_query || "—";
        rowsEl.textContent = JSON.stringify(
          data.intermediate?.result_rows || [],
          null,
          2
        );
        errorEl.textContent = data.error || "None";
        statusEl.textContent = "Done";
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Network error: " + err.message;
        statusEl.textContent = "Error";
      } finally {
        askBtn.disabled = false;
      }
    }

    askBtn.addEventListener("click", askQuestion);

    questionInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        askQuestion();
      }
    });
  </script>
</body>
</html>
